# Unsloth QLoRA fine-tuning config for Qwen 3 8B as Feiyue worker
# Target: RTX 5060 8GB VRAM

# ── Model ──
model_name: "unsloth/Qwen3-8B-Instruct-bnb-4bit"
max_seq_length: 4096
load_in_4bit: true
dtype: null  # auto-detect

# ── LoRA ──
r: 16
lora_alpha: 32
lora_dropout: 0.05
target_modules:
  - "q_proj"
  - "k_proj"
  - "v_proj"
  - "o_proj"
  - "gate_proj"
  - "up_proj"
  - "down_proj"
use_rslora: false
loftq_config: null

# ── Training ──
learning_rate: 2.0e-4
lr_scheduler_type: "cosine"
warmup_ratio: 0.1
num_train_epochs: 3
per_device_train_batch_size: 2
gradient_accumulation_steps: 4
gradient_checkpointing: true
gradient_checkpointing_kwargs:
  use_reentrant: false

# ── Optimizer ──
optim: "adamw_8bit"
weight_decay: 0.01
max_grad_norm: 1.0

# ── Data ──
dataset_kwargs:
  data_files:
    train: "data/train.jsonl"
    validation: "data/val.jsonl"
packing: false

# ── Saving ──
output_dir: "./feiyue-qwen-8b-worker"
save_strategy: "epoch"
save_total_limit: 2
push_to_hub: true
hub_model_id: "Sinonchum/feiyue-qwen-8b-worker"
hub_private_repo: false

# ── Logging ──
logging_steps: 5
report_to: "none"
